[mgr]
ratio          = [ 1, 4, 3 ]
show_hidden    = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false
linemode = "size_and_mtime"
show_symlink = true
title_format   = "ヤズ: {cwd}"
SHELL = "fish"

[preview]
max_width       = 3840
max_height      = 2160
image_quality = 90

[pick]
open_title  = "で開く:"

[opener]
xld = [
    { run = 'open -a XLD "$@"', desc = "XLD", for = "macos" },
]

[open]
prepend_rules = [
	{ url = "*.cue", use = [ "xld", "edit" ] },
]

[plugin]
prepend_preloaders = [
    { mime = "image/vnd.adobe.photoshop", run = "sips-preview" },
    { mime = "{audio,video}/*", run = "mediainfo" },
    { mime = "image/*", run = "allmytoes" },
    { url = "*.{blend,blend1}", run = "blender-preview" },
    { url = "*.{csv,tsv,json,parquet,txt,xlsx,db,duckdb}", run = "duckdb" },
    { url = "*.{ai,eps,ait}", run = "mediainfo" },
    { url = "*.{3mf,obj,pts,ply,stl,step,stp}", run="f3d-preview"},
]
prepend_previewers = [
    { mime = "image/vnd.adobe.photoshop", run = "sips-preview" },
    { mime = "{audio,video}/*", run = "mediainfo" },
    { mime = "image/*", run = "allmytoes" },
    { mime = "text/markdown", run = "piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark '$1'" },
    { url = "*.{blend,blend1}", run = "blender-preview" },
    { url = "*.{csv,tsv,json,parquet,txt,xlsx}", run = "duckdb", multi = false },
    { url = "*.{ai,eps,ait}", run = "mediainfo" },
    { url = "*.{3mf,obj,pts,ply,stl,step,stp}", run="f3d-preview"},
]

[[plugin.prepend_fetchers]]
id     = "mactag" # Remove if Yazi > v26.1.22
url    = "*"
run    = "mactag"
group  = "mactag"

[[plugin.prepend_fetchers]]
id     = "mactag" # Remove if Yazi > v26.1.22
url    = "*/"
run    = "mactag"
group  = "mactag"
