set -g default-terminal "xterm-ghostty"
set -ga terminal-overrides ",xterm-256color*:RGB"
# set -a terminal-features 'xterm-256color:RGB'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Better Tmux Toggle
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Make Fish our Default Shell
set -g default-command /opt/homebrew/bin/fish
set -g default-shell /opt/homebrew/bin/fish

set -g history-limit 5000

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced baby! 🏄'

#
# π ---------------------------------------------------------//
# // :: DISPLAY
# // : ----------------------------------------------------- #}
# renumber windows when a window is closed
set -g renumber-windows on

# set terminal title
set -g set-titles on

# slightly longer pane indicators display time
set -g display-panes-time 800
# slightly longer status messages display time
set -g display-time 1000

# redraw status line every second
set -g status-interval 1

# Session name max-width
set -g status-left-length 60

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# π ---------------------------------------------------------//
# // :: NAVIGATION
# // : ----------------------------------------------------- #}
# create new session/window
bind C-c new-session
bind c new-window -c "#{pane_current_path}"

# FZF
FZF_DEFAULT_OPTS="--color=fg:#ff7edb,border:#03edf9,bg+:#fede5d,gutter:-1,fg+:bold:black,query:#72f1b8,info:#03edf9,prompt:#03edf9,marker:#03edf9,pointer:#ff00ff,label:#03edf9,hl:#e5fe5d,hl+:#ff00ff,header:#ffefae"
TMUX_FZF_PREVIEW=0

## Session
TMUX_FZF_SESSION_FORMAT="//--> "
unbind t
bind-key t run-shell -b "afplay ~/.dotfiles/vim/sounds/Blip.wav & ~/.tmux/plugins/tmux-fzf/scripts/session.sh switch && afplay ~/.dotfiles/vim/sounds/Tink.wav"
# bind-key t run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

# slit panes
unbind %
bind - split-window -c "#{pane_current_path}"
unbind '"'
bind | split-window -h -c "#{pane_current_path}"

# pane navigation
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r h resize-pane -L 10
bind -r j resize-pane -D 10
bind -r k resize-pane -U 10
bind -r l resize-pane -R 10

# window navigation
unbind n
unbind p
# bind -r C-h previous-window # select previous window
# bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

# Jump
set -g @jump-key 's'

# toggle mouse
set -g mouse on

# π ---------------------------------------------------------//
# // :: BUFFERS
# // : ----------------------------------------------------- #}
bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

# π ---------------------------------------------------------//
# // :: PLUGIN MANAGER
# // : ----------------------------------------------------- #}
# set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'barlevalon/tmux-nowplaying'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes


set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

bind-key T run-shell -b "afplay -v 0.5 ~/.dotfiles/vim/sounds/cyber-message.mp3 & ~/.tmux/plugins/tmux-pomodoro-plus/scripts/pomodoro.sh toggle"
set -g @pomodoro_toggle 'p'
set -g @pomodoro_mins 25
set -g @pomodoro_break_mins 5
set -g @pomodoro_long_break_mins 25
set -g @pomodoro_intervals 4
set -g @pomodoro_repeat 'off'
set -g @pomodoro_notifications 'on'
set -g @pomodoro_on "  #[fg=color13]󰋑  󰋑  󰋑  󰋑  󰋑  #[fg=color6]"
set -g @pomodoro_complete "  #[fg=color17]⛧  "
set -g @pomodoro_pause "  #[fg=color14]󱙝  "
set -g @pomodoro_prompt_break "  #[fg=color2]⛧  Hail Satan"
set -g @pomodoro_prompt_pomodoro "  #[fg=color2]󰢚 Start an Adventure?"
set -g @pomodoro_granularity 'on'
set -g @pomodoro_interval_display "  🧙🏼‍♂️️ #[fg=color1]%s"
set -g @pomodoro_sound 'Submarine.aiff'

# Audio
set -g @nowplaying_scrolling_enabled "yes"
set -g @nowplaying_scrollable_threshold 50
set -g @nowplaying_playing_icon "♪ "
set -g @nowplaying_auto_interval "yes"
set -g @nowplaying_scroll_speed 5
set -g @nowplaying_playing_interval 1


# π ---------------------------------------------------------//
# // :: THEME
# // : ----------------------------------------------------- #}
set-option -g status-right-length 150

set -g pane-border-style 'fg=color0'
set -g pane-active-border-style 'fg=color0'

set -g status-style 'bg=default fg=color7'
set -g status-left "#[fg=color16,bg=yellow,bold,italics] 👽 #S #[fg=yellow,bg=default,nobold,noitalics,nounderscore]"
# set -g status-right "#{prefix_highlight}#[fg=color14,bg=default,nobold,noitalics,nounderscore]#[fg=color11,bg=color14] %Y-%m-%d #[fg=magenta,bg=color14,nobold,noitalics,nounderscore]#[fg=color16,bg=magenta] ⛧ 物の哀れ 🌊 🛸 "
set -g status-right "#{nowplaying} #(~/.dotfiles/tmux/scripts/pomodoro-hearts.sh) #[fg=color8,bg=default,nobold,noitalics,nounderscore]  #{cpu_fg_color} #{cpu_icon} #{cpu_percentage}  #[fg=color14,bg=default,nobold,noitalics,nounderscore]#[fg=color11,bg=color14] %Y-%m-%d #[fg=color17,bg=color14,bold]W%W #[fg=magenta,bg=color14,nobold,noitalics,nounderscore]#[fg=color16,bold,bg=magenta] ⛧ #(timew work-day :today) ⛧ "

set -g window-status-format "#[fg=color16,bg=color14,nobold,noitalics,nounderscore] #[fg=color11,bg=color14]#I #[fg=color16,bg=color14,nobold,noitalics,nounderscore] #[fg=color11,bg=color14]#W #F #[fg=color14,bg=default,nobold,noitalics,nounderscore]"

# set -g window-status-bell-style "#[fg=default,bg=color14,nobold,noitalics,nounderscore] #[fg=color11,bg=color14]#I #[fg=color16,bg=color14,nobold,noitalics,nounderscore] #[fg=color11,bg=color14]#W #F #[fg=color14,bg=default,nobold,noitalics,nounderscore]"

set -g window-status-current-format "#[fg=color16,bg=color6,nobold,italics,nounderscore] #[fg=color13,bg=color6]#I #[fg=color14,bg=color6,bold,italics,nounderscore] #[fg=color13,bg=color6]#W #F #[fg=color6,bg=default,nobold,noitalics,nounderscore]"

# run '~/.config/tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tpm/tpm'

