# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                    🚀 BOOTSTRAP  //  起動  🔌                            ║
# ╚══════════════════════════════════════════════════════════════════════════╝
run '~/.tmux/plugins/tpm/tpm'

# ── Pane Tabs // Reclaim the stolen keys 👻 ───────────────────────────
# tmux-pane-tabs hardcodes T/N/P/X and loads with tpm, stomping pomodoro (T),
# choose-buffer (P) and harpoon (X). Take them back and move tabs to C-*.
unbind T
unbind N
unbind P
unbind X
unbind C-,
bind-key T run-shell -b "afplay -v 0.5 ~/.dotfiles/vim/sounds/cyber-message.mp3 & ~/.tmux/plugins/tmux-pomodoro-plus/scripts/pomodoro.sh toggle"
bind P choose-buffer

# Driven by our fork at tmux/scripts/pane-tabs.sh (upstream + a `rename`
# command backed by the @pane_tabs_label pane option), so TPM updates to the
# plugin can't clobber it. N renames a tab (mirrors prefix , for windows);
# empty input resets the name back to the running command.
bind-key C-t run-shell "~/.dotfiles/tmux/scripts/pane-tabs.sh new  '#{pane_id}'"
bind-key C-n run-shell "~/.dotfiles/tmux/scripts/pane-tabs.sh next '#{pane_id}'"
bind-key C-p run-shell "~/.dotfiles/tmux/scripts/pane-tabs.sh prev '#{pane_id}'"
bind-key C-x run-shell "~/.dotfiles/tmux/scripts/pane-tabs.sh close '#{pane_id}'"
bind-key N command-prompt -I "#{@pane_tabs_label}" -p "tab name:" \
    "run-shell \"~/.dotfiles/tmux/scripts/pane-tabs.sh rename '#{pane_id}' '%%'\""

# Kill the plugin's pane-border tab row — the tab pill lives in status-right
# instead (see conf/06-theme.conf @pane_tabs_segment).
set -g pane-border-status off
set -g pane-border-style 'fg=color0'
set -g pane-active-border-style 'fg=color0'

set -g focus-events off
set -g set-clipboard off

# Buffer terminal query responses so they aren't split into stray keystrokes.
# Ghostty's XTVERSION reply (DCS: ESC P >|ghostty <ver> ESC \) arrives byte-split
# through tmux on session resume. With escape-time too low, tmux releases the
# leading ESC alone, then forwards P/>/o/... as separate keys -> in normal mode
# P pastes and o opens insert, dumping the clipboard into the buffer. A larger
# window lets tmux forward the whole DCS intact so Neovim discards it.
# Set after tpm so it overrides tmux-sensible's escape-time 0.
set -sg escape-time 100

