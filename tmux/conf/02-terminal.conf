# ║                                                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════════╝
#   🌊 Terminal emulation, color depth, passthrough
#   🌊 All the bits flowing through the neon veins

# ── Terminal Emulation // Ghostty rides the wave 👻 ───────────────────
set -g default-terminal "xterm-ghostty"
set -ga terminal-overrides ",xterm-256color*:RGB"

# ── Passthrough // Let the signal through, no interference ───────────
set -g allow-passthrough on
set -s allow-passthrough on

# ── Environment // Carry the keys across dimensions ───────────────────
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ── Extended Keys // Unlock the forbidden combos ─────────────────────
set -s extended-keys always
set -g xterm-keys on

# ── Undercurl // Wavy like synthwave 🌊 ──────────────────────────────
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
