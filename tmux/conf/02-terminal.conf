# ║                                                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════════╝
#   🌊 Terminal emulation, color depth, passthrough
#   🌊 All the bits flowing through the neon veins

# ── Terminal Emulation // Ghostty rides the wave 👻 ───────────────────
# Inside tmux, TERM must be a tmux-aware terminfo (tmux-256color), NOT the outer
# terminal's xterm-ghostty. Neovim keys its tmux-aware terminal-query handling
# off $TERM; with xterm-ghostty inside tmux it does not wrap/consume Ghostty's
# XTVERSION DCS reply, which then leaks in as stray keys (P=paste, o=insert) and
# dumps the clipboard into the buffer on startup/resume. RGB + features are
# re-declared via terminal-features keyed on the outer Ghostty client.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty*:RGB"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:strikethrough:usstyle:overline:title"

# ── Passthrough // Let the signal through, no interference ───────────
set -g set-clipboard off
set -g allow-passthrough on
set -s allow-passthrough on
set -ga update-environment GHOSTTY_RESOURCES_DIR
set -ga update-environment GHOSTTY_BIN_DIR

# ── Environment // Carry the keys across dimensions ───────────────────
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ── Extended Keys // Unlock the forbidden combos ─────────────────────
set -s extended-keys always
set -g xterm-keys on

# ── Undercurl // Wavy like synthwave 🌊 ──────────────────────────────
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
