# ║                                                        ║
# ║         ⚡ Core settings — the neural lattice          ║
# ║        ⚡ Prefix, shell, history, and heartbeat        ║
# ║                                                        ║
# ╚════════════════════════════════════════════════════════╝
# ── Prefix // "I've seen things you people wouldn't believe…" ────────
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ── Shell // Dive into the fish tank 🐠 ──────────────────────────────
set -g default-command /opt/homebrew/bin/fish
set -g default-shell /opt/homebrew/bin/fish

# ── History // All those moments will be lost in time… ───────────────
set -g history-limit 5000

# ── Reload // Wake up, time to die ⚡ ─────────────────────────────────
bind r source-file ~/.tmux.conf \; run-shell 'afplay -v 0.2 ~/.dotfiles/vim/sounds/HongKong97.mp3 & tmux display "~/.tmux.conf sourced baby! 🏄"'

# ── Window Renumber // Clean up the grid ─────────────────────────────
set -g renumber-windows on

# ── Titles // Name every ghost in the machine ────────────────────────
set -g set-titles on

# ── Display Timing // Blink and you'll miss it ───────────────────────
set -g display-panes-time 800
set -g display-time 1000

# ── Status Interval // Heartbeat at 1Hz ──────────────────────────────
set -g status-interval 1

# ── Status Left Width // Room for the session glyph ──────────────────
set -g status-left-length 60

# ── Clear Screen // Scorched earth protocol 🔥 ───────────────────────
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# ── Bell // Silence. The void stares back. ───────────────────────────
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

