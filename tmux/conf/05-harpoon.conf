# ── The Box // Summon the configuration ⛓️ ─────────────────────────────
set -g @harpoon_sound_jump "afplay -v 0.2 ~/.dotfiles/vim/sounds/Hollow.wav"
set -g @harpoon_sound_hook "afplay -v 0.3 ~/.dotfiles/vim/sounds/GetOverHere.mp3"
set -g @harpoon_cmd "~/.dotfiles/tmux/scripts/harpoon.sh"
set -g @harpoon_map "a r s t g m n e i o q w f p b j l u y z x c d v k h"

# F24 — the forbidden key, whispered through Karabiner, unused by mortal apps
set -g @harpoon_key_append1  'F24'
set -g @harpoon_key_replace1 'F24'

# ── Exorcism // Banish old keybinds to the void ───────────────────────
unbind -n M-1
unbind -n M-2
unbind -n M-3
unbind -n M-4
unbind -n M-5
unbind g
unbind G
unbind A
unbind X
unbind v

# ── Chains of Anguish // No prefix — instant flesh-tearing teleport ⛓️ ─
run-shell '
    map=$(tmux show -gv @harpoon_map);
    n=1;
    for k in $map;
        do tmux bind-key -n "M-$k" run-shell -b "#{@harpoon_cmd} -s $n & #{@harpoon_sound_jump}";
        n=$((n+1));
    done
'

# ── Reforging the Hook // Prefix + key — drive deeper into flesh ──────
run-shell '
    map=$(tmux show -gv @harpoon_map);
    n=1;
    for k in $map;
        do tmux bind-key "M-$k" run-shell -b "#{@harpoon_cmd} -R $n & #{@harpoon_sound_hook}";
        n=$((n+1));
    done
'

# ── The Engineer // Edit the lament configuration ─────────────────────
bind-key M-b run-shell "#{@harpoon_cmd} -A"   # pin this soul to the grid
bind-key M-i run-shell "tmux popup -E nvim ~/Library/Caches/.tmux-harpoon-sessions" # open the lament manuscript
