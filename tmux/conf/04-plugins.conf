# ║                                                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════════╝

# ── Plugin Manager // The hub ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# ── Plugin Roster // Assemble the crew ───────────────────────────────
set -g @plugin 'barlevalon/tmux-nowplaying'
set -g @plugin 'Chaitanyabsprip/tmux-harpoon'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-yank'

# ── Resurrect + Continuum // Persist across the void 💾 ──────────────
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# ── FZF // The oracle speaks in neon pink 💖 ─────────────────────────
FZF_DEFAULT_OPTS="--color=fg:#ff7edb,border:#03edf9,bg+:#fede5d,gutter:-1,fg+:bold:black,query:#72f1b8,info:#03edf9,prompt:#03edf9,marker:#03edf9,pointer:#ff00ff,label:#03edf9,hl:#e5fe5d,hl+:#ff00ff,header:#ffefae"
TMUX_FZF_PREVIEW=0
TMUX_FZF_SESSION_FORMAT="//--> "

unbind t
bind-key t run-shell -b "afplay ~/.dotfiles/vim/sounds/Blip.wav & ~/.tmux/plugins/tmux-fzf/scripts/session.sh switch && afplay ~/.dotfiles/vim/sounds/Tink.wav"

# ── Pomodoro // The ritual of focus 🍅⛧ ──────────────────────────────
bind-key T run-shell -b "afplay -v 0.5 ~/.dotfiles/vim/sounds/cyber-message.mp3 & ~/.tmux/plugins/tmux-pomodoro-plus/scripts/pomodoro.sh toggle"
set -g @pomodoro_toggle 'p'
set -g @pomodoro_mins 25
set -g @pomodoro_break_mins 5
set -g @pomodoro_long_break_mins 25
set -g @pomodoro_intervals 4
set -g @pomodoro_repeat 'off'
set -g @pomodoro_notifications 'on'
set -g @pomodoro_on "  #[fg=color13]󰋑  󰋑  󰋑  󰋑  󰋑  #[fg=color6]"
set -g @pomodoro_complete "  #[fg=color17]⛧  "
set -g @pomodoro_pause "  #[fg=color14]󱙝  "
set -g @pomodoro_prompt_break "  #[fg=color2]⛧  Hail Satan"
set -g @pomodoro_prompt_pomodoro "  #[fg=color2]󰢚 Start an Adventure?"
set -g @pomodoro_granularity 'on'
set -g @pomodoro_interval_display "  🧙🏼‍♂️️ #[fg=color1]%s"
set -g @pomodoro_sound 'Submarine.aiff'

# ── NowPlaying // What's spinning in the headphones? 🎧 ──────────────
set -g @nowplaying_scrolling_enabled "yes"
set -g @nowplaying_scrollable_threshold 50
set -g @nowplaying_playing_icon "♪ "
set -g @nowplaying_auto_interval "yes"
set -g @nowplaying_scroll_speed 5
set -g @nowplaying_playing_interval 1
