# ╚═════════════════════════════════════════════════╝
set-option -g status-right-length 180

# ── Pane Borders // The grid lines of the sprawl ──────────────────────
set -g pane-border-style 'fg=color0'
set -g pane-active-border-style 'fg=color0'

# ── Messages // System whispers ───────────────────────────────────────
set -g message-style 'fg=color13 bg=default bold'
set -g message-command-style 'fg=color13 bg=default bold'

# ── Status Bar Foundation // The neon baseline ────────────────────────
set -g status-style 'bg=default fg=color7'

# ── Status Left // Session glyph — who are we in this sprawl? ────────
set -g status-left "#[fg=color16,bg=color3,bold,italics] 👽 #S #[fg=color3,bg=default,nobold,noitalics,nounderscore]"

# ── Pane Tabs // The active pane's tab count, in the bar not the border ──
# Reads the @pane_tabs_title pane option (set by scripts/pane-tabs.sh) rather
# than pane_title, which fish/nvim overwrite via OSC escapes. Follows the
# active pane, so selecting a tabbed pane in a split shows its pill instantly.
set -g @pane_tabs_segment "#{?#{@pane_tabs_title},#[fg=color1#,bg=default#,nobold#,noitalics#,nounderscore]#[fg=color0#,bg=color1#,bold] 󰓩 #{@pane_tabs_title} #[fg=color14#,bg=color1#,nobold],#[fg=color14#,bg=default#,nobold#,noitalics#,nounderscore]}"

# ── Status Right // Dashboard of the void ─────────────────────────────
set -g status-right "#{nowplaying}    #(~/.dotfiles/tmux/scripts/crush-status.sh) #(~/.dotfiles/tmux/scripts/pomodoro-hearts.sh) #[fg=color8,bg=default,nobold,noitalics,nounderscore]  #{cpu_fg_color} #{cpu_icon} #{cpu_percentage} #{E:@pane_tabs_segment}#[fg=color11,bg=color14] %Y-%m-%d #[fg=color17,bg=color14,bold]W%V #[fg=magenta,bg=color14,nobold,noitalics,nounderscore]#[fg=color16,bold,bg=magenta] ⛧ #(timew work-day :today) ⛧ "

# ── Window Tabs // Fragments of consciousness ─────────────────────────
set -g window-status-separator ""

# Inactive windows — dim, like memories fading
set -g window-status-format "#[fg=color16,bg=color14,nobold,noitalics,nounderscore] #[fg=color11,bg=color14]#I #[fg=color16,bg=color14,nobold,noitalics,nounderscore] #[fg=color11,bg=color14]#W #F #[fg=color14,bg=default,nobold,noitalics,nounderscore]"

# Active window — the spotlight in the darkness
set -g window-status-current-format "#[fg=color16,bg=color6,nobold,italics,nounderscore] #[fg=color13,bg=color6]#I #[fg=color14,bg=color6,bold,italics,nounderscore] #[fg=color13,bg=color6]#W #F #[fg=color6,bg=default,nobold,noitalics,nounderscore]"

